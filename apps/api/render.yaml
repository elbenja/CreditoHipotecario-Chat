# One-click Render deploy for the API.
#
# No healthCheckPath: the only route is POST /api/chat, and a GET to it 404s,
# which Render scores as unhealthy and would fail the deploy. With none set,
# Render falls back to port binding, which this server does satisfy.
services:
  - type: web
    name: creditohipotecario-chat-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm --filter @chat/api start
    envVars:
      - key: MOONSHOT_API_KEY
        sync: false
      - key: MOONSHOT_MODEL
        value: kimi-k2.7-code-highspeed
      - key: MOONSHOT_BASE_URL
        value: https://api.moonshot.ai/v1
      - key: CORS_ORIGIN
        sync: false
